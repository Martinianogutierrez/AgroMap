[project]
name = "fpz-worker"
version = "0.1.0"
requires-python = ">=3.11"
description = "Field Productivity Zones worker + pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
