<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgroGIS Assistant</title>
<style>
  :root {
    --green-900: #1b5e20;
    --green-700: #2e7d32;
    --green-500: #43a047;
    --green-100: #e8f5e9;
    --soil: #5d4037;
    --bg: #f4f8f4;
    --card: #ffffff;
    --text: #263238;
    --muted: #78909c;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(27, 94, 32, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #eef6ee 0%, var(--bg) 40%);
    color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(90deg, var(--green-900), var(--green-700));
    color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow);
  }
  header svg { flex: 0 0 auto; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .sub { font-size: 12px; opacity: .85; }
  #status {
    margin-left: auto; font-size: 12px; background: rgba(255,255,255,.15);
    padding: 5px 11px; border-radius: 999px; white-space: nowrap;
  }
  #status.off { background: #c62828; }
  main { flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%; margin: 0 auto; }
  #chat {
    flex: 1; overflow-y: auto; padding: 22px 18px 8px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: var(--radius);
    line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .user { align-self: flex-end; background: var(--green-700); color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: var(--card); border: 1px solid #dfe9df; border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .action {
    align-self: flex-start; max-width: 78%; font-size: 12.5px; background: var(--green-100);
    border: 1px solid #c8e6c9; border-left: 4px solid var(--green-500);
    padding: 8px 12px; border-radius: 8px; white-space: pre-wrap;
  }
  .action.err { background: #ffebee; border-color: #ffcdd2; border-left-color: #c62828; }
  .action b { color: var(--green-900); }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
    background: var(--green-500); animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .suggestions {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 18px 4px; justify-content: center;
  }
  .chip {
    border: 1px solid var(--green-500); color: var(--green-900); background: #fff;
    padding: 7px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
    transition: .15s;
  }
  .chip:hover { background: var(--green-100); transform: translateY(-1px); }
  form {
    display: flex; gap: 10px; padding: 12px 18px 18px; max-width: 860px; width: 100%;
    margin: 0 auto;
  }
  #input {
    flex: 1; padding: 13px 16px; border: 1px solid #cfd8dc; border-radius: 999px;
    font-size: 15px; outline: none; background: #fff;
  }
  #input:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(67,160,71,.15); }
  #send {
    border: 0; background: var(--green-700); color: #fff; padding: 0 24px;
    border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  #send:hover { background: var(--green-900); }
  #send:disabled { background: #a5d6a7; cursor: wait; }
  footer { text-align: center; font-size: 11.5px; color: var(--muted); padding-bottom: 10px; }
</style>
</head>
<body>
<header>
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
    <path d="M12 21c0-6 3-11 9-13-1 8-4 12-9 13z" fill="#a5d6a7"/>
    <path d="M12 21C7 19 4 13 3 6c7 2 9 8 9 15z" fill="#e8f5e9"/>
    <path d="M12 21V10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>AgroGIS Assistant</h1>
    <div class="sub">Control por lenguaje natural de tu proyecto QGIS</div>
  </div>
  <div id="status">comprobando QGIS…</div>
</header>

<main>
  <div id="chat"></div>
  <div class="suggestions" id="suggestions">
    <button class="chip">Carga el NDVI 2025</button>
    <button class="chip">Recorta el NDVI usando el límite del lote</button>
    <button class="chip">Calcula la diferencia entre NDVI 2025 y 2024</button>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Escribe una acción para QGIS…" />
    <button id="send" type="submit">Enviar</button>
  </form>
</main>
<footer>PoC · FastAPI + QGIS listener (localhost:5000) · las acciones se ejecutan en la instancia QGIS activa</footer>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const history = [];

  async function refreshStatus() {
    try {
      const r = await fetch("/api/status");
      const s = await r.json();
      statusEl.textContent = (s.qgis ? "QGIS conectado" : "QGIS desconectado") + " · " + s.mode;
      statusEl.classList.toggle("off", !s.qgis);
    } catch {
      statusEl.textContent = "backend caído";
      statusEl.classList.add("off");
    }
  }
  refreshStatus();
  setInterval(refreshStatus, 15000);

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = "bubble " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addAction(action) {
    const ok = action.result && action.result.success;
    const div = document.createElement("div");
    div.className = "action" + (ok ? "" : " err");
    const args = JSON.stringify(action.args);
    const detail = ok
      ? (action.result.message || action.result.layers
          ? "✓ " + (action.result.message || action.result.layers.length + " capas listadas")
          : "✓ ejecutado")
      : "✗ " + (action.result.error || "error");
    div.innerHTML = "<b>" + action.tool + "</b> " + args + "\n" + detail;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask(text) {
    if (!text.trim()) return;
    add("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    send.disabled = true;
    const typing = add("bot", "");
    typing.classList.add("typing");
    typing.innerHTML = "<span></span><span></span><span></span>";

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
      });
      const data = await r.json();
      typing.remove();
      (data.actions || []).forEach(addAction);
      add("bot", data.reply || "(sin respuesta)");
      history.push({ role: "assistant", content: data.reply || "" });
    } catch (e) {
      typing.remove();
      add("bot", "Error de conexión con el backend: " + e);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  document.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => ask(b.textContent))
  );
  add("bot", "Hola. Soy tu asistente agro-tech conectado a QGIS. Prueba una acción rápida de abajo o escríbeme lo que quieras hacer con tus capas.");
</script>
</body>
</html>
